name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o zorion-android-v2.zip -d project
      - name: Find project folder
        run: |
          ROOT=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZORION-v2-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
